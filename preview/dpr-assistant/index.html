<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPR Assistant — project report & CMA from simple questions (preview)</title>
<meta name="description" content="Answer plain questions about your business and get a bank-ready DPR + CMA Excel. Runs in your browser.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2733;--mute:#5d6b7a;--line:#e3e7ec;--acc:#1f6f5c;--acc2:#e8f3ef;--warn:#9a5b00;--warnbg:#fff6e5;--pend:#fff3b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 18px 6px;max-width:620px;margin:auto}header h1{font-size:15px;margin:0;color:var(--mute);font-weight:600;letter-spacing:.2px}
header .tag{font-size:12px;color:var(--mute)}
main{max-width:620px;margin:auto;padding:0 12px 120px}
#progress .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}#progress .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
#progress .sec{font-size:12px;color:var(--mute);margin:6px 2px 10px}
#card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
h2{font-size:21px;margin:0 0 6px;line-height:1.3}h3{font-size:16px;margin:20px 0 6px}h4{margin:14px 0 4px;font-size:15px}
.help{color:var(--mute);margin:0 0 12px}.small{font-size:13px}
label.f{display:block;margin:14px 0}.lbl{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;padding:10px 11px;border:1px solid #cfd6de;border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
.unit{display:flex;align-items:center;gap:6px}.unit em{font-style:normal;color:var(--mute);font-size:13px;white-space:nowrap}
.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button{flex:1 1 45%;padding:11px 10px;border:1px solid #cfd6de;border-radius:10px;background:#fff;font:inherit;text-align:left;cursor:pointer}
.choices button.on{border-color:var(--acc);background:var(--acc2);font-weight:600}
.pending,.choices.pending{background:var(--pend)!important}
.list .item{border:1px solid var(--line);border-radius:12px;padding:6px 12px 10px;margin:10px 0;background:#fbfcfd}
.ihead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);font-weight:600}
.x{border:0;background:none;color:#a33;font-size:13px;cursor:pointer}
.add,.ghost,.btn{display:inline-block;padding:10px 14px;border:1px solid var(--acc);color:var(--acc);background:#fff;border-radius:10px;font:inherit;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
.primary{padding:12px 18px;border:0;background:var(--acc);color:#fff;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin:4px 6px 4px 0}
.mini{padding:5px 9px;border:1px solid #cfd6de;background:#fff;border-radius:8px;font-size:12px;cursor:pointer;margin:6px 6px 0 0;color:var(--ink)}
.series{margin:16px 0}.series .lbl small{font-weight:400;color:var(--mute)}
.yrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.yr span{display:block;font-size:12px;color:var(--mute)}
.yr input{padding:8px}
.hist table{width:100%;border-collapse:collapse;font-size:14px}.hist td,.hist th{padding:4px 3px;text-align:left;vertical-align:middle}.hist th{font-size:12px;color:var(--mute)}
.hist td:first-child{width:42%}.hist input,.hist select{padding:7px 6px;font-size:14px}
.info{background:var(--acc2);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}.info:empty{display:none}
.calc{font-size:13px;color:var(--acc);margin-top:6px}
.adv{opacity:.85}.why{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.bad{color:#b3261e;font-weight:700}.warn{color:var(--warn)}
.ticks{padding-left:18px}.ticks li{margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.sum div{background:var(--acc2);border-radius:10px;padding:10px}.sum span{display:block;font-size:12px;color:var(--mute)}.sum b{font-size:18px}
.warns li{background:var(--warnbg);margin:6px 0;padding:8px 10px;border-radius:8px;list-style:none;font-size:14px}.warns{padding:0}
.unk li{font-size:14px}
.aibox{border:1px dashed #b9c6d2;border-radius:12px;padding:10px 12px;margin:6px 0 12px;background:#fcfdfe}.aibox summary{cursor:pointer;color:var(--acc);font-weight:600}
.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.ph{background:#e9edf1;border-radius:6px;padding:0 5px;font-size:13px;color:#33475b}
details summary{cursor:pointer;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
nav div{max-width:620px;margin:auto;display:flex;justify-content:space-between}
nav button{padding:12px 22px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
#back{border:1px solid #cfd6de;background:#fff;color:var(--ink)}#next{border:0;background:var(--acc);color:#fff}
footer{max-width:620px;margin:16px auto;padding:0 14px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header><h1>DPR Assistant <span class="tag">· preview</span></h1></header>
<main>
  <div id="progress"></div>
  <section id="card" aria-live="polite"></section>
  <footer>Prototype for testing. The Excel engine is a standard DPR/CMA model (17 tabs, ₹ lakh). Figures come only from your answers and the defaults shown to you; the bank makes its own assessment. Your answers stay in this browser unless you choose the optional AI help.</footer>
</main>
<nav><div><button id="back">Back</button><button id="next">Next</button></div></nav>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<script src="xlsxfill.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
