<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Know the Industry: South Gujarat (sample)</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#2563eb;
--fact:#15803d;--factb:#dcfce7;--rep:#1d4ed8;--repb:#dbeafe;--inf:#b45309;--infb:#fef3c7;--unk:#475569;--unkb:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:14px 14px 56px}
h1{font-size:22px;margin:8px 0 4px;line-height:1.25}
h2{font-size:18px;margin:0 0 8px;display:flex;gap:10px;align-items:center}
h2 .n{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:#0f172a;color:#fff;font-size:13px;font-weight:700}
h3{font-size:14px;margin:14px 0 6px}
a{color:var(--acc)}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 10px}
.banner{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:650;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;align-items:center}
.tag{display:inline-block;font-size:11px;font-weight:750;letter-spacing:.3px;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap;vertical-align:1px}
.t-fact{background:var(--factb);color:var(--fact)}.t-reported{background:var(--repb);color:var(--rep)}
.t-inference{background:var(--infb);color:var(--inf)}.t-unknown{background:var(--unkb);color:var(--unk)}
.t-live{background:var(--factb);color:var(--fact)}.t-planned{background:var(--unkb);color:var(--unk)}.t-pri{background:var(--infb);color:var(--inf)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.toc a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink);text-decoration:none}
ul.cl{list-style:none;margin:0;padding:0}
ul.cl li{padding:9px 0;border-top:1px solid var(--line)}
ul.cl li:first-child{border-top:0}
ul.cl li .tx{display:block;margin-top:3px}
sup a{font-size:11px;text-decoration:none;font-weight:700;margin-left:2px}
.cnt{margin-left:auto;font-size:11px;color:var(--mut);font-weight:500;display:flex;gap:4px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);background:#f8fafc}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chain{display:flex;flex-direction:column;gap:0;align-items:stretch;margin:6px 0 12px}
.stage{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.stage b{display:block;font-size:14px}.stage span{font-size:12.5px;color:var(--mut)}
.stage.here{background:#eff6ff;border:2px solid var(--acc)}
.arrow{text-align:center;color:var(--mut);line-height:1.2;font-size:16px}
@media(min-width:760px){.chain{flex-direction:row;align-items:stretch}.stage{flex:1}.arrow{align-self:center;padding:0 3px}.arrow:before{content:"\2192"}.arrow span{display:none}}
@media(max-width:759px){.arrow:before{content:"\2193"}}
ol.steps{margin:6px 0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;padding:8px 0 8px 36px;position:relative;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:#e2e8f0;text-align:center;font-weight:700;font-size:12.5px;line-height:24px}
.note{background:#fffbeb;border-left:3px solid #f59e0b;padding:8px 10px;border-radius:0 8px 8px 0;font-size:14px;margin:6px 0 10px}
.snap{border:2px solid #bfdbfe;background:#f8fbff}
.disc{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:24px;font-size:13px;color:#334155}
.srcs ol{padding-left:22px;margin:6px 0}.srcs li{margin:6px 0;font-size:13px;word-break:break-word}.srcs .p{color:var(--mut)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
.btn.on{background:#0f172a;color:#fff;border-color:#0f172a}
body.onlyunk ul.cl li:not([data-tag=unknown]),body.onlyunk tr:not([data-tag=unknown]),body.onlyunk .stage,body.onlyunk ol.steps li{display:none}
body.onlyunk .snap{display:none}
.clus h2{font-size:16px}
.idx li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.idx li .nm{font-weight:600}.idx li.pl .nm{color:#64748b;font-weight:500}
.idx .vf{font-size:12px;color:var(--mut);flex-basis:100%}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}
.nav a,.nav span{font-size:13.5px}
.pt th:nth-child(5),.pt td:nth-child(5){white-space:nowrap}
.tr-up{color:#b91c1c;font-weight:700}.tr-down{color:#15803d;font-weight:700}.tr-flat{color:#64748b;font-weight:700}
.pt .pu{display:none;color:#64748b;font-size:12.5px}
@media(max-width:640px){.pt thead{display:none}.pt tr{display:flex;flex-wrap:wrap;gap:2px 10px;padding:8px 6px;border-bottom:1px solid var(--line)}.pt td{border:0;padding:0}.pt td.pi{flex-basis:100%}.pt td.pp{flex-basis:100%;font-size:15px}.pt .pu{display:inline}.pt td.pu2{display:none}.pt td.pd{color:#64748b;font-size:12.5px}.pt .grp td{flex-basis:100%;padding:4px 6px}.pt tr.grp{padding:0}}
.pt .grp td{background:#f8fafc;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:#475569}
.side{font-size:13.5px;margin:4px 0 0;padding:8px 10px;border:1px dashed #94a3b8;border-radius:10px;background:#fff}
@media print{.toc,.btn,.banner,.nav{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<main id="app"><p class="sub">Loading…</p></main>
<script>
(function(){
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var TAGS={fact:'Fact (official)',reported:'Reported (news / trade)',inference:'Inference',unknown:'Unknown'};
function chip(t){return '<span class="tag t-'+esc(t)+'">'+esc(TAGS[t]||t)+'</span>'}
function get(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var q=new URLSearchParams(location.search);var slug=(q.get('i')||'').replace(/[^a-z0-9\-]/g,'');
var DISC='<div class="disc"><b>Public data only. Educational, not a credit decision.</b> Every statement is tagged. <i>Fact (official)</i> comes from a government, regulator, gazette or rating-agency document. <i>Reported</i> comes from news or trade bodies and has not been independently checked. <i>Inference</i> is reasoning or a standard checklist, not a measured number. <i>Unknown</i> means no verified public figure exists: collect it from the customer. Nothing here uses customer or bank data. Numbers are never produced by an AI model.</div>';
var LEG='<div class="card"><div class="legend"><b>How to read the tags:</b> '+chip('fact')+' '+chip('reported')+' '+chip('inference')+' '+chip('unknown')+' <button class="btn" id="unkbtn" type="button">Show only what I must collect (Unknown)</button></div></div>';
function bindUnk(){var b=document.getElementById('unkbtn');if(!b)return;b.onclick=function(){var on=document.body.classList.toggle('onlyunk');b.classList.toggle('on',on);b.textContent=on?'Showing Unknown only. Tap to show all':'Show only what I must collect (Unknown)'}}

function renderIndex(idx,msg){
 var h='<h1>Know the Industry: South Gujarat</h1><p class="sub">Plain-English industry primers for credit officers. Same nine sections for every industry. Updated '+esc(idx.updated)+'.</p>';
 h+='<div class="banner">Sample for review on the staging site only. The live Lending Radar has not been changed.</div>';
 if(msg)h+='<div class="note">'+esc(msg)+'</div>';
 h+='<div class="card"><b>The nine sections on every page</b><ol style="margin:6px 0 0;padding-left:20px"><li>What it is</li><li>Sub-segments, and which one the page covers</li><li>Where it sits in the value chain</li><li>What the unit actually does</li><li>Raw materials and prices (inputs and sale price, with dates)</li><li>Bottlenecks (pollution, licences, machinery, labour, power)</li><li>Sales: who buys, how, credit periods</li><li>Unit economics</li><li>Fragility points and early warning signs</li></ol><p class="sub" style="margin-top:8px">Plus a source list and a last-checked date. '+esc(idx.status_note)+'</p></div>';
 h+=LEG;
 var live={};idx.clusters.forEach(function(c){c.items.forEach(function(i){live[i.slug]=i})});
 Object.keys(idx.chains||{}).forEach(function(k){var ch=idx.chains[k];h+='<div class="card"><h2>'+esc(ch.title)+'</h2><p class="sub">Each stage feeds the next. Tap a LIVE stage to open it.</p><div class="chain">';
  ch.order.forEach(function(s,n){var it=live[s]||{title:s,status:'planned'};if(n)h+='<div class="arrow"><span>then</span></div>';
   h+='<div class="stage"><b>'+(it.status==='live'?'<a href="?i='+esc(s)+'">'+esc(it.title)+'</a>':esc(it.title))+'</b><span>'+(it.status==='live'?'LIVE':'planned')+'</span></div>'});
  h+='</div>';(ch.side||[]).forEach(function(x){var it=live[x.slug]||{title:x.slug,status:'planned'};h+='<div class="side">Side input: '+(it.status==='live'?'<a href="?i='+esc(x.slug)+'">'+esc(it.title)+'</a>':esc(it.title))+' &middot; '+esc(x.text)+'</div>'});if(ch.note)h+='<p class="sub" style="margin-top:8px">'+esc(ch.note)+'</p>';h+='</div>'});
 idx.clusters.forEach(function(c){h+='<div class="card clus"><h2>'+esc(c.name)+'</h2><ul class="cl idx">';
  c.items.forEach(function(i){var pl=i.status!=='live';
   h+='<li class="'+(pl?'pl':'')+'"><span class="nm">'+(pl?esc(i.title):'<a href="?i='+esc(i.slug)+'">'+esc(i.title)+'</a>')+'</span><span class="tag t-'+(pl?'planned':'live')+'">'+(pl?'planned':'live')+'</span>'+(i.priority==='high'&&pl?'<span class="tag t-pri">proposed early</span>':'')+(i.note?'<span class="sub" style="margin:0">'+esc(i.note)+'</span>':'')+(i.verified?'<span class="vf">'+esc(i.verified)+'</span>':'')+'</li>'});
  h+='</ul></div>'});
 h+=DISC;app.innerHTML=h;bindUnk();document.title='Know the Industry: South Gujarat (sample)'}

function renderPage(d,idx){
 var map={},n=0;d.sources.forEach(function(s){map[s.id]=++n});
 function cites(a){if(!a||!a.length)return'';return '<sup>'+a.map(function(id){return map[id]?'<a href="#src-'+map[id]+'" title="Source '+map[id]+'">['+map[id]+']</a>':''}).join('')+'</sup>'}
 function items(arr){return '<ul class="cl">'+arr.map(function(x){return '<li data-tag="'+esc(x.tag)+'">'+chip(x.tag)+'<span class="tx">'+esc(x.text)+cites(x.src)+'</span></li>'}).join('')+'</ul>'}
 var h='<p class="sub"><a href="index.html">&larr; All industries</a></p>';
 h+='<h1>'+esc(d.title)+'</h1><p class="sub">'+esc(d.subtitle)+' &middot; '+esc(d.cluster)+' &middot; Last checked <b>'+esc(d.last_checked)+'</b></p>';
 h+='<div class="banner">Sample for review on the staging site only. For: '+esc(d.audience)+'. The live Lending Radar has not been changed.</div>';
 // chain nav
 var ch=idx&&idx.chains&&idx.chains[d.chain_group];
 if(ch){var p=ch.order.indexOf(d.slug),li={};idx.clusters.forEach(function(c){c.items.forEach(function(i){li[i.slug]=i})});
  function lk(s,pre){if(!s)return '<span></span>';var it=li[s]||{title:s,status:'planned'};return it.status==='live'?'<a href="?i='+esc(s)+'">'+pre+esc(it.title)+'</a>':'<span class="sub" style="margin:0">'+pre+esc(it.title)+' (planned)</span>'}
  if(p>=0)h+='<div class="nav">'+lk(ch.order[p-1],'&larr; Before: ')+lk(ch.order[p+1],'Next: ')+'</div>';
  else h+='<div class="nav"><span>Side input to the chain: '+ch.order.map(function(x){return lk(x,'')}).filter(function(x,i){var o=ch.order[i];return o==='surat-mmf-weaving'||o==='surat-embroidery'}).join(' &middot; ')+'</span></div>'}
 h+='<div class="card"><b>This page covers:</b> '+esc(d.covers)+'</div>';
 if(d.snapshot&&d.snapshot.length)h+='<div class="card snap"><b>Read this first (30 seconds)</b>'+items(d.snapshot)+'</div>';
 h+=LEG;
 h+='<nav class="toc">'+d.sections.map(function(s,i){return '<a href="#sec-'+esc(s.id)+'">'+(i+1)+'. '+esc(s.title.split(',')[0].split(':')[0])+'</a>'}).join('')+'<a href="#sources">Sources</a></nav>';
 d.sections.forEach(function(s,i){
  var c={};var tally=function(t){c[t]=(c[t]||0)+1};
  var body='';
  s.blocks.forEach(function(b){
   if(b.type==='items'){b.items.forEach(function(x){tally(x.tag)});body+=items(b.items)}
   else if(b.type==='group'){body+='<h3>'+esc(b.title)+'</h3>';b.items.forEach(function(x){tally(x.tag)});body+=items(b.items)}
   else if(b.type==='note'){body+='<div class="note">'+esc(b.text)+'</div>'}
   else if(b.type==='table'){body+='<div class="tw"><table><thead><tr>'+b.head.map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'<th>Tag</th></tr></thead><tbody>'+b.rows.map(function(r){tally(r.tag);return '<tr data-tag="'+esc(r.tag)+'">'+r.cells.map(function(x,k){return '<td>'+(k===0?'<b>'+esc(x)+'</b>':esc(x))+(k===r.cells.length-1?cites(r.src):'')+'</td>'}).join('')+'<td>'+chip(r.tag)+'</td></tr>'}).join('')+'</tbody></table></div>'}
   else if(b.type==='prices'){var TR={up:'<span class="tr-up">&#9650; rising</span>',down:'<span class="tr-down">&#9660; falling</span>',flat:'<span class="tr-flat">&#9654; steady</span>'};
    var rowp=function(r){tally(r.tag);return '<tr data-tag="'+esc(r.tag)+'"><td class="pi"><b>'+esc(r.item)+'</b></td><td class="pp">'+esc(r.price)+(r.unit?' <span class="pu">'+esc(r.unit)+'</span>':'')+cites(r.src)+'</td><td class="pu2">'+esc(r.unit||'')+'</td><td class="pd">'+esc(r.date||'')+'</td><td>'+(TR[r.trend]||'<span class="tr-flat">no series</span>')+'</td><td>'+chip(r.tag)+'</td></tr>'};
    var ins=b.rows.filter(function(r){return r.kind!=='output'}),outs=b.rows.filter(function(r){return r.kind==='output'});
    body+='<h3>'+esc(b.title||'Prices')+'</h3>'+(b.note?'<p class="sub">'+esc(b.note)+'</p>':'')+'<div class="tw"><table class="pt"><thead><tr><th>Item</th><th>Latest public price</th><th>Unit</th><th>Date</th><th>Trend</th><th>Tag</th></tr></thead><tbody>'+(ins.length?'<tr class="grp"><td colspan="6">Inputs</td></tr>'+ins.map(rowp).join(''):'')+(outs.length?'<tr class="grp"><td colspan="6">Output / sale price</td></tr>'+outs.map(rowp).join(''):'')+'</tbody></table></div>'}
   else if(b.type==='chain'){tally(b.tag);body+='<div class="chain">'+b.stages.map(function(x,k){return (k?'<div class="arrow"><span>then</span></div>':'')+'<div class="stage'+(x.here?' here':'')+'"><b>'+esc(x.label)+'</b><span>'+esc(x.sub||'')+'</span></div>'}).join('')+'</div><p class="sub">Stage order and names: '+chip(b.tag)+cites(b.src)+'</p>'}
   else if(b.type==='steps'){tally(b.tag);body+=(b.note?'<div class="note">'+chip(b.tag)+' '+esc(b.note)+'</div>':'')+'<ol class="steps">'+b.steps.map(function(x){return '<li><b>'+esc(x.t)+'</b><br>'+esc(x.d)+'</li>'}).join('')+'</ol>'}
  });
  var cnt=Object.keys(TAGS).filter(function(t){return c[t]}).map(function(t){return '<span class="tag t-'+t+'">'+c[t]+' '+t+'</span>'}).join('');
  h+='<section class="card" id="sec-'+esc(s.id)+'"><h2><span class="n">'+(i+1)+'</span>'+esc(s.title)+'<span class="cnt">'+cnt+'</span></h2>'+body+'</section>'});
 h+='<section class="card srcs" id="sources"><h2>Sources</h2><p class="sub">Open each link to check the original. Last checked '+esc(d.last_checked)+'. Some sites (for example GERC and CPCB documents) may be slow to load.</p><ol>'+d.sources.map(function(s){return '<li id="src-'+map[s.id]+'"><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a><br><span class="p">'+esc(s.publisher)+(s.date?' &middot; '+esc(s.date):'')+'</span>'+(s.note?'<br><i class="p">'+esc(s.note)+'</i>':'')+'</li>'}).join('')+'</ol></section>';
 h+=DISC;
 app.innerHTML=h;bindUnk();document.title=d.title+' | Know the Industry (sample)'}

get('data/index.json').then(function(idx){
 if(!slug){renderIndex(idx);return}
 get('data/'+slug+'.json').then(function(d){renderPage(d,idx)}).catch(function(){renderIndex(idx,'The page "'+slug+'" is not built yet. Pick one marked LIVE.')})
}).catch(function(){app.innerHTML='<div class="note">Could not load the industry list. Please refresh.</div>'});
})();
</script>
</body>
</html>
