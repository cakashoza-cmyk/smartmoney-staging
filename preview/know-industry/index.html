<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Know the Industry: South Gujarat</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#1a1a1a;--mut:#5e5e5e;--line:#e6e6e6;--bg:#fff}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 22px 80px}
h1{font-size:1.55rem;font-weight:650;line-height:1.25;margin:8px 0 8px;letter-spacing:-0.02em}
h3{font-size:0.95rem;font-weight:650;margin:22px 0 8px}
a{color:var(--ink);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
.back{display:inline-block;color:var(--mut);text-decoration:none;font-size:0.95rem;margin:0 0 20px}
.back:before{content:"\2190  "}
.back:hover{text-decoration:underline}
.kicker{color:var(--mut);font-size:0.92rem;margin:0 0 14px}
.lede{margin:0 0 22px;font-size:1.05rem;line-height:1.65}
.meta{color:var(--mut);font-size:0.85rem;margin:0 0 20px}
.facts{margin:0;border-top:1px solid var(--line)}
.facts>div{padding:12px 0;border-bottom:1px solid var(--line)}
.facts>div:last-child{border-bottom:0}
.facts dt{font-size:0.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0 0 3px;font-weight:500}
.facts dd{margin:0}
@media(min-width:600px){
  .facts{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
  .facts>div:nth-last-child(-n+2){border-bottom:0}
}
.lab{font-size:0.72rem;color:#8a8a8a;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.lab:before{content:" · "}
sup,sup a{font-size:0.7rem;font-weight:500;color:var(--mut);text-decoration:none;margin-left:0.2em}
sup a:hover{text-decoration:underline}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:16px 0;font-size:1.05rem;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.3}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-weight:400;color:var(--mut);font-size:1.2rem;line-height:1}
details[open] summary:after{content:"\2212"}
.panel{padding:0 0 22px}
ul.cl,ol.steps{margin:0;padding:0;list-style:none}
ul.cl li{padding:10px 0;border-top:1px solid var(--line)}
ul.cl li:first-child{border-top:0;padding-top:0}
ol.steps{counter-reset:s;margin:8px 0 0}
ol.steps li{counter-increment:s;padding:10px 0 10px 2rem;border-top:1px solid var(--line);position:relative}
ol.steps li:first-child{border-top:0}
ol.steps li:before{content:counter(s)".";position:absolute;left:0;top:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:0.95rem;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:0.95rem}
th,td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:0.72rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding-top:0}
tr.grp td{font-size:0.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);
  font-weight:500;padding:16px 0 6px;border:0}
.pt td.item{padding-right:12px}
.pt .when{color:var(--mut);font-size:0.88rem;white-space:nowrap}
@media(max-width:599px){
  .pt thead{display:none}
  .pt tbody tr:not(.grp){display:block;padding:10px 0;border-bottom:1px solid var(--line)}
  .pt tbody tr:not(.grp) td{display:block;border:0;padding:0}
  .pt td.price{margin:2px 0}
  .pt .when{white-space:normal}
  .pt tr.grp{display:block;padding:14px 0 2px;border:0}
}
.chain{margin:4px 0 8px}
.stage{padding:6px 0}
.stage .who{font-weight:600}
.stage .what{color:var(--mut);font-size:0.92rem}
.stage.here .who{text-decoration:underline;text-underline-offset:3px}
.arrow{color:var(--mut);padding:0 0 0 2px;line-height:1}
.side{color:var(--mut);font-size:0.95rem;margin:12px 0 0}
.idx-list{list-style:none;margin:0 0 36px;padding:0}
.idx-list li{padding:14px 0;border-top:1px solid var(--line)}
.idx-list li:last-child{border-bottom:1px solid var(--line)}
.idx-list a{font-weight:600;text-decoration:none}
.idx-list a:hover{text-decoration:underline}
.idx-list .t{font-weight:600}
.idx-list .d{display:block;color:var(--mut);font-size:0.95rem;margin-top:2px}
.idx-list .pl .t,.idx-list .pl .d{color:#9a9a9a}
.group{margin:32px 0 0}
.group h2{font-size:0.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut);margin:0 0 4px}
.group.planned h2,.group.planned .idx-list li{color:#9a9a9a}
.group.planned .idx-list li{border-color:#eeeeee}
.disc{margin:36px 0 0;color:var(--mut);font-size:0.88rem;line-height:1.55}
.srcs ol{margin:0;padding-left:1.3rem}
.srcs li{margin:0 0 10px;padding-left:4px}
.srcs .p{color:var(--mut);font-size:0.9rem}
.msg{color:var(--mut);margin:0 0 16px}
</style>
</head>
<body>
<main id="app"><p class="kicker">Loading…</p></main>
<script>
(function(){
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var TAGS={fact:'Fact',reported:'Reported',inference:'Inference',unknown:'Unknown'};
function lab(t){return t?'<span class="lab">'+esc(TAGS[t]||t)+'</span>':''}
function get(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var q=new URLSearchParams(location.search);
var slug=(q.get('i')||'').replace(/[^a-z0-9\-]/g,'');
var DISC='<p class="disc">Public data only. Educational, not a credit decision. Every statement is tagged: <i>Fact</i> comes from a government, regulator, gazette or rating-agency document; <i>Reported</i> comes from news or trade bodies and has not been independently checked; <i>Inference</i> is reasoning or a checklist, not a measured number; <i>Unknown</i> means no verified public figure exists, so collect it from the customer. Nothing here uses customer or bank data. Numbers are never produced by an AI model.</p>';

function bindCites(){
  app.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="#src-"]');
    if(!a)return;
    var t=document.getElementById(a.getAttribute('href').slice(1));
    if(!t)return;
    var d=t.closest('details');
    if(d)d.open=true;
  });
}

function renderIndex(idx,msg){
  var h='<h1>Know the Industry</h1>';
  h+='<p class="kicker">South Gujarat primers for credit officers. Same sections on every page. Updated '+esc(idx.updated)+'.</p>';
  h+='<p class="meta">Staging sample. The live Lending Radar has not been changed.</p>';
  if(msg)h+='<p class="msg">'+esc(msg)+'</p>';
  if(idx.status_note)h+='<p class="note">'+esc(idx.status_note)+'</p>';
  idx.clusters.forEach(function(c){
    var anyLive=c.items.some(function(i){return i.status==='live'});
    h+='<section class="group'+(anyLive?'':' planned')+'"><h2>'+esc(c.name)+(anyLive?'':' — planned')+'</h2><ul class="idx-list">';
    c.items.forEach(function(i){
      var pl=i.status!=='live';
      var name=pl?'<span class="t">'+esc(i.title)+'</span>':'<a href="?i='+esc(i.slug)+'">'+esc(i.title)+'</a>';
      var desc=i.blurb||i.note||'';
      h+='<li class="'+(pl?'pl':'')+'">'+name+(desc?'<span class="d">'+esc(desc)+'</span>':'')+'</li>';
    });
    h+='</ul></section>';
  });
  h+=DISC;
  app.innerHTML=h;
  document.title='Know the Industry: South Gujarat';
}

function renderPage(d,idx){
  var map={},n=0;
  d.sources.forEach(function(s){map[s.id]=++n});
  function cites(a){
    if(!a||!a.length)return'';
    return '<sup>'+a.map(function(id){return map[id]?'<a href="#src-'+map[id]+'">'+map[id]+'</a>':''}).join(' ')+'</sup>';
  }
  function items(arr){
    return '<ul class="cl">'+arr.map(function(x){
      return '<li data-tag="'+esc(x.tag)+'">'+esc(x.text)+cites(x.src)+lab(x.tag)+'</li>';
    }).join('')+'</ul>';
  }
  function blocks(list){
    var body='';
    (list||[]).forEach(function(s){
      (s.blocks||[]).forEach(function(b){
        if(b.type==='items')body+=items(b.items);
        else if(b.type==='group'){body+='<h3>'+esc(b.title)+'</h3>'+items(b.items)}
        else if(b.type==='note'){body+='<p class="note">'+esc(b.text)+'</p>'}
        else if(b.type==='table'){
          body+='<table><thead><tr>'+b.head.map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+
            b.rows.map(function(r){
              return '<tr data-tag="'+esc(r.tag)+'">'+r.cells.map(function(x,k){
                return '<td>'+(k===0?'<b>'+esc(x)+'</b>':esc(x))+(k===r.cells.length-1?cites(r.src)+lab(r.tag):'')+'</td>';
              }).join('')+'</tr>';
            }).join('')+'</tbody></table>';
        }
        else if(b.type==='prices'){
          var rowp=function(r){
            var price=esc(r.price)+(r.unit?' '+esc(r.unit):'');
            var when=esc(r.date||'');
            return '<tr data-tag="'+esc(r.tag)+'"><td class="item"><b>'+esc(r.item)+'</b>'+lab(r.tag)+'</td><td class="price">'+price+cites(r.src)+'</td><td class="when">'+when+'</td></tr>';
          };
          var ins=b.rows.filter(function(r){return r.kind!=='output'});
          var outs=b.rows.filter(function(r){return r.kind==='output'});
          body+=(b.note?'<p class="note">'+esc(b.note)+'</p>':'')+
            '<table class="pt"><thead><tr><th>Item</th><th>Price</th><th>Date and source</th></tr></thead><tbody>'+
            (ins.length?'<tr class="grp"><td colspan="3">Inputs</td></tr>'+ins.map(rowp).join(''):'')+
            (outs.length?'<tr class="grp"><td colspan="3">Output / sale price</td></tr>'+outs.map(rowp).join(''):'')+
            '</tbody></table>';
        }
        else if(b.type==='chain'){
          body+='<div class="chain">'+b.stages.map(function(x,k){
            return (k?'<div class="arrow">↓</div>':'')+
              '<div class="stage'+(x.here?' here':'')+'"><div class="who">'+esc(x.label)+(x.here?' (this unit)':'')+'</div>'+
              (x.sub?'<div class="what">'+esc(x.sub)+'</div>':'')+'</div>';
          }).join('')+'</div><p class="note">Stage order and names'+cites(b.src)+lab(b.tag)+'</p>';
        }
        else if(b.type==='steps'){
          body+=(b.note?'<p class="note">'+esc(b.note)+lab(b.tag)+'</p>':'')+
            '<ol class="steps">'+b.steps.map(function(x){return '<li><b>'+esc(x.t)+'</b><br>'+esc(x.d)+'</li>'}).join('')+'</ol>';
        }
      });
    });
    return body;
  }

  function collectUnknowns(){
    var out=[],seen={};
    function add(text,src,where){
      if(!text||seen[text])return;
      seen[text]=1;
      out.push({text:text,src:src,where:where});
    }
    (d.snapshot||[]).forEach(function(x){if(x.tag==='unknown')add(x.text,x.src,'At a glance')});
    (d.sections||[]).forEach(function(s){
      (s.blocks||[]).forEach(function(b){
        (b.items||[]).forEach(function(x){if(x.tag==='unknown')add(x.text,x.src,s.title)});
        (b.rows||[]).forEach(function(r){
          if(r.tag!=='unknown')return;
          var label=r.item||(r.cells&&r.cells[0])||'';
          var val=r.price||(r.cells&&r.cells[1])||'';
          add(label+(val?': '+val:''),r.src,s.title);
        });
      });
    });
    return out;
  }

  var byId={};
  (d.sections||[]).forEach(function(s){byId[s.id]=s});
  var order=[
    {id:'what',title:'What it is',ids:['what','sub']},
    {id:'chain',title:'Value chain',ids:['chain']},
    {id:'process',title:'Process',ids:['process']},
    {id:'raw',title:'Raw materials and prices',ids:['raw']},
    {id:'sales',title:'Sales and buyers',ids:['sales']},
    {id:'econ',title:'Unit economics',ids:['econ']},
    {id:'bottle',title:'Bottlenecks and compliance',ids:['bottle']},
    {id:'fragile',title:'Fragility points',ids:['fragile']}
  ];

  var h='<a class="back" href="index.html">All industries</a>';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="kicker">'+esc(d.subtitle)+'</p>';
  h+='<p class="meta">'+esc(d.cluster)+' · Last checked '+esc(d.last_checked)+' · Staging sample, not a credit decision</p>';
  if(d.lede)h+='<p class="lede">'+esc(d.lede)+'</p>';
  else if(d.covers)h+='<p class="lede">'+esc(d.covers)+'</p>';

  var facts=d.keyfacts||[];
  if(facts.length){
    h+='<dl class="facts">';
    facts.forEach(function(f){
      h+='<div><dt>'+esc(f.label)+'</dt><dd>'+esc(f.text)+cites(f.src)+lab(f.tag)+'</dd></div>';
    });
    h+='</dl>';
  }

  // What it is opens with the snapshot, then the section body
  order.forEach(function(sec,i){
    var parts=sec.ids.map(function(id){return byId[id]}).filter(Boolean);
    var body='';
    if(sec.id==='what'&&d.snapshot&&d.snapshot.length)body+=items(d.snapshot);
    body+=blocks(parts);
    if(!body)return;
    h+='<details'+(i===0?' open':'')+' id="sec-'+esc(sec.id)+'"><summary>'+esc(sec.title)+'</summary><div class="panel">'+body+'</div></details>';
  });

  var unk=collectUnknowns();
  var ubody=unk.length
    ? '<p class="note">These points have no verified public figure. Collect them from the customer.</p>'+
      '<ul class="cl">'+unk.map(function(x){return '<li>'+esc(x.text)+cites(x.src)+(x.where?'<span class="lab">'+esc(x.where)+'</span>':'')+'</li>'}).join('')+'</ul>'
    : '<p class="note">No Unknown items were marked on this page.</p>';
  h+='<details id="sec-unknowns"><summary>Unknowns to collect</summary><div class="panel">'+ubody+'</div></details>';

  h+='<details class="srcs" id="sources"><summary>Sources</summary><div class="panel">';
  h+='<p class="note">Open each link to check the original. Last checked '+esc(d.last_checked)+'. Some sites may be slow to load.</p>';
  h+='<ol>'+d.sources.map(function(s){
    return '<li id="src-'+map[s.id]+'"><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a><br><span class="p">'+esc(s.publisher)+(s.date?' · '+esc(s.date):'')+'</span>'+(s.note?'<br><span class="p">'+esc(s.note)+'</span>':'')+'</li>';
  }).join('')+'</ol></div></details>';

  h+=DISC;
  app.innerHTML=h;
  bindCites();
  document.title=d.title+' · Know the Industry';
}

get('data/index.json').then(function(idx){
  if(!slug){renderIndex(idx);return}
  get('data/'+slug+'.json').then(function(d){renderPage(d,idx)}).catch(function(){
    renderIndex(idx,'The page "'+slug+'" is not built yet. Pick a live industry from the list.');
  });
}).catch(function(){app.innerHTML='<p class="msg">Could not load the industry list. Please refresh.</p>'});
})();
</script>
</body>
</html>
